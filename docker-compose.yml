version: '3.8'

services:
  app:
    build: .
    container_name: nepse-predictor
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./models:/app/models
    environment:
      - DATABASE_URL=sqlite:///./nepse.db
      - LOG_LEVEL=INFO
    ports:
      - "5000:5000"
    restart: unless-stopped
    command: python train.py

  # Optional: PostgreSQL database
  postgres:
    image: postgres:15-alpine
    container_name: nepse-db
    environment:
      POSTGRES_DB: nepse_db
      POSTGRES_USER: nepse_user
      POSTGRES_PASSWORD: nepse_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

volumes:
  postgres_data:
